# The checks that can run without a person watching a window. Same name and shape as the
# verify.yml in NetControl, Redline PDF, File Manager and File Compare.
#
# The release workflow only runs on a tag, so without this nothing runs the suite on the way in.
name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Windows, and not negotiable. LogicControl.App is net10.0-windows because WPF requires it, and
    # LogicControl.Tests targets the same framework so it can construct the view models and the
    # updater - so the whole solution only builds here. The engine itself (LogicControl.Core) is
    # plain net10.0 and builds anywhere.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LogicControl.slnx

      # Separate from the test step so that a warning promoted to an error in src/ reads as a build
      # failure rather than as a failing test. TreatWarningsAsErrors turns on for src/ once the app
      # has built clean on Windows - see Directory.Build.targets.
      - name: Build
        run: dotnet build LogicControl.slnx -c Release --no-restore

      - name: Test
        run: dotnet test LogicControl.slnx -c Release --no-build --nologo
